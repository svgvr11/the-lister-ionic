apply plugin: 'com.android.application'

def versionPropsFile = file('version.properties')
def appVersionName = "1.0"
def appVersionCode = 1

if (versionPropsFile.exists()) {
    def props = new Properties()
    props.load(new FileInputStream(versionPropsFile))
    appVersionName = props.getProperty('VERSION_NAME', "1.0")
    appVersionCode = props.getProperty('VERSION_CODE', "1") as Integer
} else {
    logger.info("version.properties not found. Using default version (1.0 / 1) for debug build. Run 'npm run bundle' or 'npm run apk' to generate version.properties.")
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "dev.vmunoz.thelister"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.atenis.thelister"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                def storeFilePath = keystoreProps.getProperty('storeFile')
                if (storeFilePath) {
                    File sf = new File(storeFilePath)
                    if (!sf.isAbsolute()) {
                        sf = rootProject.file(storeFilePath)
                    }
                    storeFile sf
                }
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def isReleaseBuild = graph.allTasks.any { it.name == 'bundleRelease' || it.name == 'assembleRelease' }
    if (isReleaseBuild) {
        if (!versionPropsFile.exists()) {
            throw new GradleException("ERROR: version.properties no encontrado. Ejecuta 'npm run bundle' antes de compilar una release.")
        }
        if (!keystorePropsFile.exists()) {
            throw new GradleException("ERROR: keystore.properties no encontrado en android/. Es necesario para firmar builds de release (AAB/APK release). Crea keystore.properties según las instrucciones.")
        } else {
            def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            def missingKeys = []
            requiredKeys.each { key ->
                if (!keystoreProps.getProperty(key)) {
                    missingKeys.add(key)
                }
            }
            if (!missingKeys.isEmpty()) {
                throw new GradleException("ERROR: keystore.properties no contiene las siguientes claves requeridas: ${missingKeys.join(', ')}")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
