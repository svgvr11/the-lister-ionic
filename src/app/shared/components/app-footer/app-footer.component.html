<!-- Pie al final del contenido de <ion-content>: no es fijo ni cubre el FAB, se lee al
     llegar al final del scroll. -->
<footer class="app-footer">
  <!-- Izquierda: estado de la sincronización con la nube. -->
  <p class="sync-status" [class.is-offline]="!online()">
    <span class="sync-dot" aria-hidden="true"></span>
    <span class="sync-status-text" role="status" aria-live="polite">{{ syncLabel }}</span>
  </p>

  <!-- Centro: copyright. -->
  <p class="app-footer-copyright">&copy; {{ year }} Atenis / The Lister</p>

  <!-- Derecha: enlaces legales (páginas estáticas públicas) y versión. En nativo se abren
       con el plugin Browser; en web, en pestaña nueva. -->
  <div class="app-footer-meta">
    <a class="app-footer-link" [href]="privacyUrl" target="_blank" rel="noopener noreferrer" (click)="openLegal(privacyUrl)">Privacidad</a>
    <a class="app-footer-link" [href]="deleteAccountUrl" target="_blank" rel="noopener noreferrer" (click)="openLegal(deleteAccountUrl)">Eliminar cuenta</a>
    <span class="app-footer-version">{{ appVersionLabel }}</span>
  </div>
</footer>
