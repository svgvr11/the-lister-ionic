<ion-header>
  <ion-toolbar class="topbar">
    <div class="title-wrapper">
      <div *ngIf="!editingTitle" class="title-display">
        <ion-title class="board-title">{{ board.title }} </ion-title>
        <button class="edit-title-btn" (click)="startEditTitle()" aria-label="Editar título">
          <ion-icon name="pencil"></ion-icon>
        </button>
      </div>

      <div *ngIf="editingTitle" class="title-edit">
        <ion-input
          [(ngModel)]="titleDraft"
          class="title-input"
          (keyup.enter)="confirmEditTitle()"
          (keyup.escape)="cancelEditTitle()"
          autofocus
        ></ion-input>
        <button class="confirm-title-btn" (click)="confirmEditTitle()" aria-label="Confirmar">
          <ion-icon name="checkmark"></ion-icon>
        </button>
        <button class="cancel-title-btn" (click)="cancelEditTitle()" aria-label="Cancelar">
          <ion-icon name="close"></ion-icon>
        </button>
      </div>
    </div>

    <div class="toolbar-actions" slot="end">
      <div *ngIf="searching" class="search-box">
        <ion-icon class="search-icon" name="search"></ion-icon>
        <ion-input
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange()"
          placeholder="Buscar lista..."
          class="search-input"
          (keyup.escape)="closeSearch()"
          autofocus
        ></ion-input>
        <button class="close-search-btn" (click)="closeSearch()" aria-label="Cerrar búsqueda">
          <ion-icon name="close"></ion-icon>
        </button>
      </div>

      <button
        *ngIf="!searching"
        class="toolbar-icon-btn"
        (click)="toggleSearch()"
        aria-label="Buscar"
      >
        <ion-icon class="toolbar-icon" name="search"></ion-icon>
      </button>

      <div *ngIf="authEnabled" class="account-menu-wrap">
        <button
          class="toolbar-icon-btn account-button"
          (click)="toggleAccountMenu()"
          aria-label="Abrir menú de usuario"
          aria-haspopup="menu"
          [attr.aria-expanded]="accountMenuOpen"
          title="Opciones de usuario"
        >
          <ion-icon class="avatar-icon" name="person-circle"></ion-icon>
        </button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="board-content">
  <section *ngIf="accountMenuOpen" class="account-menu" role="menu" aria-label="Opciones de usuario">
    <p class="account-menu-heading">Color del tablero</p>
    <div class="theme-options">
      <button
        *ngFor="let theme of themes"
        class="theme-option"
        [class.selected]="activeTheme.id === theme.id"
        [style.--swatch-color]="theme.background"
        role="menuitemradio"
        [attr.aria-checked]="activeTheme.id === theme.id"
        [attr.aria-label]="theme.name"
        [title]="theme.name"
        (click)="selectTheme(theme)"
      >
        <ion-icon *ngIf="activeTheme.id === theme.id" name="checkmark"></ion-icon>
      </button>
    </div>
    <button class="menu-logout" role="menuitem" (click)="logout()">
      <ion-icon name="log-out"></ion-icon>
      <span>Cerrar sesión</span>
    </button>
  </section>

  <div class="board-scroller">
    <div *ngIf="board.lists.length === 0" class="board-empty-state">
      Añade una lista para comenzar
    </div>

    <div *ngIf="board.lists.length > 0" class="board">
      <div
        #boardItem
        *ngFor="let list of visibleLists"
        class="checklist-column"
        [class.collapsed]="isCollapsed(list.id)"
        draggable="true"
        (dragstart)="startListDrag(list.id, $event)"
        (dragover)="dragOverList($event)"
        (drop)="dropList(list.id, $event)"
        (dragend)="clearDragState()"
      >
        <div class="column-header">
          <button
            class="collapse-button"
            (click)="toggleCollapsed(list.id)"
            [attr.aria-label]="isCollapsed(list.id) ? 'Expandir' : 'Colapsar'"
          >
            <ion-icon
              [name]="isCollapsed(list.id) ? 'chevron-forward' : 'chevron-down'"
            ></ion-icon>
          </button>

          <strong>
            <span
              *ngFor="let seg of getHighlightedSegments(list.title)"
              [class.highlight]="seg.highlight"
            >{{ seg.text }}</span>
          </strong>

          <span class="count">{{ list.tasks.length }}</span>
          <button
            class="delete-list-button"
            (click)="deleteList(list.id)"
            aria-label="Eliminar lista"
          >
            <ion-icon name="trash"></ion-icon>
          </button>
        </div>

        <div
          *ngIf="!isCollapsed(list.id)"
          class="tasks"
          (dragover)="dragOverTask($event)"
          (drop)="dropTaskInList(list, $event)"
        >
          <div
            *ngFor="let task of pendingTasks(list); trackBy: trackById"
            class="task"
            draggable="true"
            (dragstart)="startTaskDrag(list.id, task.id, $event)"
            (dragover)="dragOverTask($event)"
            (drop)="dropTask(list, task.id, $event)"
            (dragend)="clearDragState()"
          >
            <button
              class="check-button"
              (click)="toggleTask(list, task)"
              [class.checked]="task.completed"
              [attr.aria-label]="task.completed ? 'Desmarcar' : 'Marcar'"
            >
              <ion-icon *ngIf="task.completed" name="checkmark"></ion-icon>
            </button>
            <span class="task-text">{{ task.text }}</span>
            <button
              class="delete-button"
              (click)="deleteTask(list, task.id)"
              aria-label="Eliminar tarea"
            >
              <ion-icon name="trash"></ion-icon>
            </button>
          </div>

          <div
            *ngFor="let task of visibleCompletedTasks(list); trackBy: trackById"
            class="task completed"
            draggable="true"
            (dragstart)="startTaskDrag(list.id, task.id, $event)"
            (dragover)="dragOverTask($event)"
            (drop)="dropTask(list, task.id, $event)"
            (dragend)="clearDragState()"
          >
            <button
              class="check-button checked"
              (click)="toggleTask(list, task)"
              aria-label="Desmarcar"
            >
              <ion-icon name="checkmark"></ion-icon>
            </button>
            <span class="task-text">{{ task.text }}</span>
            <button
              class="delete-button"
              (click)="deleteTask(list, task.id)"
              aria-label="Eliminar tarea"
            >
              <ion-icon name="trash"></ion-icon>
            </button>
          </div>

          <button
            *ngIf="hiddenCompletedCount(list) > 0"
            class="show-more"
            (click)="showMore(list)"
          >
            Mostrar más · {{ hiddenCompletedCount(list) }}
          </button>

          <div
            *ngIf="pendingTasks(list).length === 0 && completedTasks(list).length === 0"
            class="empty"
          >
            Sin tareas. Añade una para comenzar.
          </div>

          <button
            *ngIf="!isCollapsed(list.id) && addingTaskFor !== list.id"
            class="add-card"
            (click)="startAddingTask(list.id)"
          >
            <ion-icon name="add"></ion-icon> Añadir tarea
          </button>

          <div *ngIf="addingTaskFor === list.id" class="add-form">
            <ion-input
              [(ngModel)]="newTaskText"
              placeholder="Nueva tarea..."
              (keyup.enter)="addTask(list)"
              autofocus
            ></ion-input>
            <button class="add-confirm" (click)="addTask(list)" aria-label="Confirmar">
              <ion-icon name="checkmark"></ion-icon>
            </button>
            <button class="cancel-button" (click)="cancelAddingTask()" aria-label="Cancelar">
              <ion-icon name="close"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Mensaje cuando no hay resultados de búsqueda -->
      <div *ngIf="searching && visibleLists.length === 0" class="no-results">
        <ion-icon name="search" class="no-results-icon"></ion-icon>
        <p>No se encontraron listas que coincidan con "<strong>{{ searchQuery }}</strong>"</p>
      </div>
    </div>
  </div>

  <div *ngIf="busy" class="saving-indicator">Guardando…</div>

  <!-- ✨ Botón flotante (FAB) para añadir lista -->
  <button
    class="fab-add-list"
    [class.open]="addingList"
    (click)="toggleAddList()"
    aria-label="Añadir lista"
  >
    <ion-icon [name]="addingList ? 'close' : 'add'"></ion-icon>
  </button>

  <!-- ✨ Panel que se despliega al hacer click en el FAB -->
  <div *ngIf="addingList" class="fab-panel">
    <div class="fab-panel-header">
      <strong>Nueva lista</strong>
      <button class="fab-panel-close" (click)="cancelAddList()" aria-label="Cerrar">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>
    <form (ngSubmit)="addList()" class="fab-panel-form">
      <ion-input
        [(ngModel)]="newListTitle"
        name="newListTitle"
        placeholder="Título de la lista..."
        class="fab-input"
      ></ion-input>
      <div class="fab-panel-actions">
        <button type="submit" class="fab-submit-btn">Crear lista</button>
      </div>
    </form>
  </div>
</ion-content>
