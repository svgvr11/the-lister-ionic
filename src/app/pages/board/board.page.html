<ion-header>
  <ion-toolbar class="topbar">
    <ion-title class="board-title">{{ board.title }} </ion-title>
    <div class="toolbar-actions" slot="end">
      <ion-icon class="avatar-icon" name="person-circle"></ion-icon>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="board-content">
  <div class="board-scroller">
    <div class="board">
      <!-- ✅ Cada columna tiene #boardItem para el masonry -->
      <div
        #boardItem
        *ngFor="let list of visibleLists"
        class="checklist-column"
        [class.collapsed]="isCollapsed(list.id)"
        draggable="true"
        (dragstart)="startListDrag(list.id, $event)"
        (dragover)="dragOverList($event)"
        (drop)="dropList(list.id, $event)"
        (dragend)="clearDragState()"
      >
        <div class="column-header">
          <button
            class="collapse-button"
            (click)="toggleCollapsed(list.id)"
            [attr.aria-label]="isCollapsed(list.id) ? 'Expandir' : 'Colapsar'"
          >
            <ion-icon
              [name]="isCollapsed(list.id) ? 'chevron-forward' : 'chevron-down'"
            ></ion-icon>
          </button>
          <strong>{{ list.title }}</strong>
          <span class="count">{{ list.tasks.length }}</span>
          <button
            class="delete-list-button"
            (click)="deleteList(list.id)"
            aria-label="Eliminar lista"
          >
            <ion-icon name="trash"></ion-icon>
          </button>
        </div>

        <div
          *ngIf="!isCollapsed(list.id)"
          class="tasks"
          (dragover)="dragOverTask($event)"
          (drop)="dropTaskInList(list, $event)"
        >
          <div
            *ngFor="let task of pendingTasks(list); trackBy: trackById"
            class="task"
            draggable="true"
            (dragstart)="startTaskDrag(list.id, task.id, $event)"
            (dragover)="dragOverTask($event)"
            (drop)="dropTask(list, task.id, $event)"
            (dragend)="clearDragState()"
          >
            <button
              class="check-button"
              (click)="toggleTask(list, task)"
              [class.checked]="task.completed"
              [attr.aria-label]="task.completed ? 'Desmarcar' : 'Marcar'"
            >
              <ion-icon *ngIf="task.completed" name="checkmark"></ion-icon>
            </button>
            <span class="task-text">{{ task.text }}</span>
            <button
              class="delete-button"
              (click)="deleteTask(list, task.id)"
              aria-label="Eliminar tarea"
            >
              <ion-icon name="trash"></ion-icon>
            </button>
          </div>

          <div
            *ngFor="let task of visibleCompletedTasks(list); trackBy: trackById"
            class="task completed"
            draggable="true"
            (dragstart)="startTaskDrag(list.id, task.id, $event)"
            (dragover)="dragOverTask($event)"
            (drop)="dropTask(list, task.id, $event)"
            (dragend)="clearDragState()"
          >
            <button
              class="check-button checked"
              (click)="toggleTask(list, task)"
              aria-label="Desmarcar"
            >
              <ion-icon name="checkmark"></ion-icon>
            </button>
            <span class="task-text">{{ task.text }}</span>
            <button
              class="delete-button"
              (click)="deleteTask(list, task.id)"
              aria-label="Eliminar tarea"
            >
              <ion-icon name="trash"></ion-icon>
            </button>
          </div>

          <button
            *ngIf="hiddenCompletedCount(list) > 0"
            class="show-more"
            (click)="showMore(list)"
          >
            Mostrar más · {{ hiddenCompletedCount(list) }}
          </button>

          <div *ngIf="pendingTasks(list).length === 0 && completedTasks(list).length === 0" class="empty">
            Sin tareas. Añade una para comenzar.
          </div>

          <button
            *ngIf="!isCollapsed(list.id) && addingTaskFor !== list.id"
            class="add-card"
            (click)="startAddingTask(list.id)"
          >
            <ion-icon name="add"></ion-icon> Añadir tarea
          </button>

          <div *ngIf="addingTaskFor === list.id" class="add-form">
            <ion-input
              [(ngModel)]="newTaskText"
              placeholder="Nueva tarea..."
              (keyup.enter)="addTask(list)"
              autofocus
            ></ion-input>
            <button class="add-confirm" (click)="addTask(list)" aria-label="Confirmar">
              <ion-icon name="checkmark"></ion-icon>
            </button>
            <button class="cancel-button" (click)="cancelAddingTask()" aria-label="Cancelar">
              <ion-icon name="close"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Columna para añadir nueva lista (también con #boardItem) -->
      <div #boardItem class="new-list-column">
        <button
          *ngIf="!addingList"
          class="new-list-trigger"
          (click)="addingList = true"
        >
           Añadir lista de checklist
        </button>
        <div *ngIf="addingList" class="new-list-form">
          <form (ngSubmit)="addList()">
            <ion-input
              [(ngModel)]="newListTitle"
              name="newListTitle"
              placeholder="Título de la lista..."
              autofocus
            ></ion-input>
            <div class="new-list-actions">
              <button type="submit" class="add-list-button">Añadir lista</button>
              <button
                type="button"
                class="cancel-button"
                (click)="cancelAddList()"
                aria-label="Cancelar"
              >
                <ion-icon name="close"></ion-icon>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="busy" class="saving-indicator">Guardando…</div>
</ion-content>
