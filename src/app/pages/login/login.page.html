<ion-content [fullscreen]="true" class="login-content">
  <main class="login-stage">
    <div class="login-stack">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">
          <img loading="lazy" src="assets/app-icon.svg" alt="" width="80" height="80" />
        </div>

      <div class="form-heading">
          <h1 id="login-title">The Lister</h1>
          <p class="form-description">Simple Checklists</p>
      </div>

      <div class="login-actions">
        <p *ngIf="errorMessage" class="form-message error" role="alert">{{ errorMessage }}</p>
        <ion-button class="google-button" expand="block" [disabled]="busy" (click)="signInWithGoogle()">
          <ion-spinner *ngIf="busy" name="crescent"></ion-spinner>
          <span *ngIf="!busy" slot="start" class="google-mark" aria-hidden="true">G</span>
          <span class="google-button-label">{{ busy ? 'Conectando con Google…' : 'Continuar con Google' }}</span>
        </ion-button>
      </div>

        <ul class="feature-list" aria-label="Características">
          <li><ion-icon name="checkmark-circle-outline"></ion-icon><span>Listas sincronizadas en tiempo real</span></li>
          <li><ion-icon name="checkmark-circle-outline"></ion-icon><span>Organización visual minimalista</span></li>
          <li><ion-icon name="checkmark-circle-outline"></ion-icon><span>Hasta 50 listas personalizadas</span></li>
        </ul>
      </section>

      <p class="version-label"><span aria-hidden="true"></span>{{ appVersionLabel }}</p>

      <!-- Enlaces legales públicos. En nativo se abren con el plugin Browser; en web,
           en pestaña nueva. -->
      <nav class="legal-links" aria-label="Enlaces legales">
        <a [href]="privacyUrl" target="_blank" rel="noopener noreferrer" (click)="openLegal(privacyUrl)">Privacidad</a>
        <span aria-hidden="true">·</span>
        <a [href]="deleteAccountUrl" target="_blank" rel="noopener noreferrer" (click)="openLegal(deleteAccountUrl)">Eliminar cuenta</a>
      </nav>
    </div>
  </main>
  <footer class="login-footer">2026 Atenis</footer>
</ion-content>
